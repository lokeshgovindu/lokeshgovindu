version: 2

updates:
  # Every action in .github/workflows is pinned to a commit SHA, which stops
  # silent upstream mutation but also means pins never pick up security or bug
  # fixes on their own. Dependabot understands SHA pins and bumps them while
  # preserving the trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all action bumps rather than one per action.
      actions:
        patterns: ["*"]

name: Generate Snake

on:
  schedule:
    # Offset from the Metrics workflow so the two don't contend.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - '*.svg'
      - 'README.md'

# Force-pushes to the `output` branch; queue overlapping runs rather than
# letting two of them publish at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to force-push the rendered SVG to the `output` branch.
      contents: write

    steps:
      - name: Render contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Filename must match the path README.md reads from.
          outputs: dist/github-contribution-grid-snake.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Metrics

on:
  # Schedule daily updates
  schedule: [{cron: "0 0/24 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # Run workflow when pushing on main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: left profile
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: github-metrics-left.svg
          user: lokeshgovindu
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8

      - name: right profile
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: github-metrics-right.svg
          user: lokeshgovindu
          template: classic
          base: ""
          plugin_isocalendar: yes
